<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Read more</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <span class="logo-icon">☰</span>
      <span class="logo-text">Read <b>more</b></span>
    </div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="#">Shop</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <div class="nav-actions">
      <button class="signup-btn">Sign Up <span class="user-icon">&#128100;</span></button>
      <span class="cart-badge">0</span>
      <a href="#" class="login-link">Login</a>
    </div>
  </header>

  <main class="contact-page">
    <section class="contact-card">
      <div class="contact-left">
        <div class="contact-hero">
          <h1>Contact Us</h1>
          <p>Have questions or feedback? Send a message and our team will reply as soon as possible.</p>
        </div>

        <form class="contact-form" action="#" method="post">
          <div class="input-group">
            <span class="input-icon">👤</span>
            <input type="text" id="name" name="name" placeholder="Your name" required>
          </div>

          <div class="input-group">
            <span class="input-icon">✉️</span>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>

          <div class="input-group textarea-group">
            <span class="input-icon">💬</span>
            <textarea id="message" name="message" placeholder="Write your message here" required></textarea>
          </div>

          <button type="submit" class="primary-btn">Send Message</button>
        </form>
      </div>

      <div class="contact-side">
        <div class="contact-bubble">📨</div>
        <p class="contact-side-text">Share your ideas, support requests, or book suggestions. We're here to help.</p>
      </div>
    </section>
  </main>

</body>
</html>
