<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Read more</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <span class="logo-icon">☰</span>
      <span class="logo-text">Read <b>more</b></span>
    </div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-actions">
      <a href="signup.html" class="signup-btn">Sign Up <span class="user-icon">&#128100;</span></a>
      <span class="cart-badge">0</span>
      <a href="login.html" class="login-link">Login</a>
    </div>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-header">
        <span class="eyebrow">Welcome back</span>
        <h1>Login</h1>
        <p>Enter your ID number and password to access your account.</p>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="input-group">
          <span class="input-icon">🆔</span>
          <input type="text" id="loginIdNumber" placeholder="ID number" required>
        </div>
        <div class="input-group">
          <span class="input-icon">🔒</span>
          <input type="password" id="loginPassword" placeholder="Password" required>
        </div>
        <button type="submit" class="primary-btn">Login</button>
      </form>
    </section>
  </main>

  <script>
    const USER_KEY = 'readmore-users';
    const loginForm = document.getElementById('loginForm');

    function getUsers() {
      return JSON.parse(localStorage.getItem(USER_KEY) || '[]');
    }

    loginForm.addEventListener('submit', event => {
      event.preventDefault();
      const idNumber = document.getElementById('loginIdNumber').value.trim();
      const password = document.getElementById('loginPassword').value;
      const users = getUsers();
      const user = users.find(u => u.idNumber === idNumber && u.password === password);

      if (!user) {
        alert('Login failed. Please check your ID number and password.');
        return;
      }

      alert(`Welcome back, ${user.fullName}!`);
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
